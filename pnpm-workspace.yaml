packages:
  - '.'

allowBuilds:
  unrs-resolver: true
  vue-demi: true

publicHoistPattern:
  - '@inertiajs/core'

overrides:
  # Keep in step with vite-plus in package.json; a lower bound installs a second core copy.
  vite: npm:@voidzero-dev/vite-plus-core@^0.2.7
  vitest: 4.1.10

minimumReleaseAgeExclude:
  - '@vueuse/core@14.4.0'
  - '@vueuse/metadata@14.4.0'
  - '@vueuse/shared@14.4.0'
